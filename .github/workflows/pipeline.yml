name: Pipeline ELT - Tipo de cambio

on:
  schedule:
    - cron: "0 14 * * 1-5"   # lunes a viernes, 09:00 hora de Lima (14:00 UTC)
  workflow_dispatch:          # botón "Run workflow" para ejecutarlo manualmente
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "dbt_tipo_cambio/**"
      - "requirements-pipeline.txt"
      - ".github/workflows/**"

permissions:
  contents: write             # necesario para hacer commit de los datos actualizados

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  elt:
    name: Extract → Load → Transform → Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Instalar dependencias (DuckDB + dbt)
        run: pip install -r requirements-pipeline.txt

      - name: Ejecutar pipeline (API BCRP → DuckDB → dbt build → Parquet)
        run: python pipeline/run_all.py

      - name: Generar documentación de dbt
        run: python -m dbt.cli.main docs generate --project-dir dbt_tipo_cambio --profiles-dir dbt_tipo_cambio

      - name: Guardar documentación dbt como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt_tipo_cambio/target/
          retention-days: 7

      - name: Publicar datos actualizados (commit automático)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "data: actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git push
          fi
